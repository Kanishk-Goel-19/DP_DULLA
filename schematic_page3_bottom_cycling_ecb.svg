<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" font-family="Courier, 'Courier New', monospace">
  <!-- Clean White Sheet with Simple Human-Style CAD Border -->
  <rect x="0" y="0" width="1600" height="1100" fill="#ffffff"/>
  <rect x="35" y="35" width="1530" height="1030" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Simple Sheet Heading -->
  <text x="65" y="80" fill="#0f172a" font-size="18" font-weight="bold">Sheet 3: Bottom Cycling Eddy Current Brake, Stepper &amp; Flywheel</text>
  <line x1="65" y1="95" x2="770" y2="95" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ===================================================================== -->
  <!-- 1. CYCLING & EDDY BRAKE ESP32 (U3) (TOP LEFT)                         -->
  <!-- ===================================================================== -->
  <polygon points="75,218 200,218 215,230 200,242 75,242" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="234" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="middle">+3V3_LDO</text>
  <line x1="215" y1="230" x2="265" y2="230" stroke="#0284c7" stroke-width="2"/>

  <polygon points="75,298 200,298 215,310 200,322 75,322" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="140" y="314" fill="#166534" font-size="11" font-weight="bold" text-anchor="middle">ENC2_CHA_3V3</text>
  <line x1="215" y1="310" x2="265" y2="310" stroke="#15803d" stroke-width="2"/>

  <polygon points="75,378 200,378 215,390 200,402 75,402" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="140" y="394" fill="#166534" font-size="11" font-weight="bold" text-anchor="middle">ENC2_CHB_3V3</text>
  <line x1="215" y1="390" x2="265" y2="390" stroke="#15803d" stroke-width="2"/>

  <polygon points="75,458 200,458 215,470 200,482 75,482" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="140" y="474" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">GND</text>
  <line x1="215" y1="470" x2="265" y2="470" stroke="#0f172a" stroke-width="2"/>

  <!-- U3: ESP32 Box -->
  <rect x="265" y="175" width="280" height="330" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="405" y="160" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">U3: ESP32 (Cycling)</text>

  <text x="280" y="234" fill="#0284c7" font-size="11" font-weight="bold">3V3</text>
  <text x="280" y="314" fill="#166534" font-size="11" font-weight="bold">GPIO32 (ENC_A)</text>
  <text x="280" y="394" fill="#166534" font-size="11" font-weight="bold">GPIO33 (ENC_B)</text>
  <text x="280" y="474" fill="#0f172a" font-size="11" font-weight="bold">GND</text>

  <text x="530" y="294" fill="#7c3aed" font-size="11" font-weight="bold" text-anchor="end">GPIO18 (STEP)</text>
  <text x="530" y="374" fill="#7c3aed" font-size="11" font-weight="bold" text-anchor="end">GPIO19 (DIR)</text>

  <line x1="545" y1="290" x2="595" y2="290" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="595,278 715,278 730,290 715,302 595,302" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="658" y="294" fill="#6d28d9" font-size="11" font-weight="bold" text-anchor="middle">STEP_PUL</text>

  <line x1="545" y1="370" x2="595" y2="370" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="595,358 715,358 730,370 715,382 595,382" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="658" y="374" fill="#6d28d9" font-size="11" font-weight="bold" text-anchor="middle">STEP_DIR</text>

  <!-- ===================================================================== -->
  <!-- 2. STEPPER DRIVER (U301), 1.2N·m STEPPER (M2) & 1:6 GEAR (TOP RIGHT)  -->
  <!-- ===================================================================== -->
  <polygon points="810,208 920,208 935,220 920,232 810,232" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="868" y="224" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">+24V_BUS</text>
  <line x1="935" y1="220" x2="980" y2="220" stroke="#dc2626" stroke-width="2"/>

  <polygon points="810,268 920,268 935,280 920,292 810,292" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="868" y="284" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">GND</text>
  <line x1="935" y1="280" x2="980" y2="280" stroke="#0f172a" stroke-width="2"/>

  <polygon points="810,338 920,338 935,350 920,362 810,362" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="868" y="354" fill="#6d28d9" font-size="11" font-weight="bold" text-anchor="middle">STEP_PUL</text>
  <line x1="935" y1="350" x2="980" y2="350" stroke="#7c3aed" stroke-width="2"/>

  <polygon points="810,398 920,398 935,410 920,422 810,422" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="868" y="414" fill="#6d28d9" font-size="11" font-weight="bold" text-anchor="middle">STEP_DIR</text>
  <line x1="935" y1="410" x2="980" y2="410" stroke="#7c3aed" stroke-width="2"/>

  <!-- U301: Stepper Driver -->
  <rect x="980" y="175" width="205" height="280" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="1082" y="160" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">U301: Stepper Driver</text>

  <text x="992" y="224" fill="#dc2626" font-size="11" font-weight="bold">VCC (24V)</text>
  <text x="992" y="284" fill="#0f172a" font-size="11" font-weight="bold">GND</text>
  <text x="992" y="354" fill="#6d28d9" font-size="11" font-weight="bold">STEP</text>
  <text x="992" y="414" fill="#6d28d9" font-size="11" font-weight="bold">DIR</text>

  <text x="1172" y="245" fill="#dc2626" font-size="11" font-weight="bold" text-anchor="end">A+</text>
  <text x="1172" y="285" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="end">A-</text>
  <text x="1172" y="335" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="end">B+</text>
  <text x="1172" y="375" fill="#15803d" font-size="11" font-weight="bold" text-anchor="end">B-</text>

  <line x1="1185" y1="241" x2="1245" y2="241" stroke="#dc2626" stroke-width="2"/>
  <line x1="1185" y1="281" x2="1245" y2="281" stroke="#0f172a" stroke-width="2"/>
  <line x1="1185" y1="331" x2="1245" y2="331" stroke="#0284c7" stroke-width="2"/>
  <line x1="1185" y1="371" x2="1245" y2="371" stroke="#15803d" stroke-width="2"/>

  <!-- M2: 1.2 N·m Stepper Motor -->
  <circle cx="1295" cy="306" r="50" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <text x="1295" y="242" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">M2: Stepper</text>
  <text x="1295" y="302" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">1.2 N.m</text>
  <text x="1295" y="322" fill="#334155" font-size="11" text-anchor="middle">Holding Trq</text>

  <!-- Coupling to GBX2 (1:6 Gear Ratio) -->
  <line x1="1345" y1="306" x2="1390" y2="306" stroke="#475569" stroke-width="3" stroke-dasharray="6,3"/>
  <rect x="1390" y="251" width="140" height="110" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="1460" y="238" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">GBX2</text>
  <text x="1460" y="290" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">1:6 Gear Ratio</text>
  <text x="1460" y="315" fill="#334155" font-size="11" text-anchor="middle">0-45 deg Disk</text>

  <!-- ===================================================================== -->
  <!-- 3. FLYWHEEL 360 PPR OPTICAL ENCODER (ENC2) & LEVEL SHIFTER (BOT LEFT) -->
  <!-- ===================================================================== -->
  <polygon points="75,688 185,688 200,700 185,712 75,712" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="132" y="704" fill="#b45309" font-size="11" font-weight="bold" text-anchor="middle">+5V_BUCK</text>
  <line x1="200" y1="700" x2="240" y2="700" stroke="#d97706" stroke-width="2"/>

  <!-- ENC2 Box -->
  <rect x="240" y="645" width="190" height="210" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="335" y="630" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">ENC2: 360 PPR</text>

  <text x="255" y="704" fill="#b45309" font-size="11" font-weight="bold">VCC (5V)</text>
  <text x="255" y="825" fill="#0f172a" font-size="11" font-weight="bold">GND</text>
  <text x="418" y="724" fill="#166534" font-size="11" font-weight="bold" text-anchor="end">OUT_A</text>
  <text x="418" y="804" fill="#166534" font-size="11" font-weight="bold" text-anchor="end">OUT_B</text>

  <!-- Level Shifter R7, R8 (Phase A) -->
  <line x1="430" y1="720" x2="460" y2="720" stroke="#15803d" stroke-width="2"/>
  <rect x="460" y="712" width="52" height="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="486" y="705" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">R7 2.2k</text>
  <line x1="512" y1="720" x2="605" y2="720" stroke="#15803d" stroke-width="2"/>
  <circle cx="535" cy="720" r="3.5" fill="#15803d"/>
  <line x1="535" y1="720" x2="535" y2="736" stroke="#0f172a" stroke-width="1.8"/>
  <rect x="527" y="736" width="16" height="32" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="549" y="756" fill="#0f172a" font-size="10" font-weight="bold">R8 3.3k</text>
  <line x1="535" y1="768" x2="535" y2="885" stroke="#0f172a" stroke-width="1.8"/>
  <circle cx="535" cy="885" r="3.5" fill="#0f172a"/>

  <polygon points="605,708 730,708 745,720 730,732 605,732" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="670" y="724" fill="#166534" font-size="11" font-weight="bold" text-anchor="middle">ENC2_CHA_3V3</text>

  <!-- Level Shifter R9, R10 (Phase B) -->
  <line x1="430" y1="800" x2="460" y2="800" stroke="#15803d" stroke-width="2"/>
  <rect x="460" y="792" width="52" height="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="486" y="785" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">R9 2.2k</text>
  <line x1="512" y1="800" x2="605" y2="800" stroke="#15803d" stroke-width="2"/>
  <circle cx="580" cy="800" r="3.5" fill="#15803d"/>
  <line x1="580" y1="800" x2="580" y2="816" stroke="#0f172a" stroke-width="1.8"/>
  <rect x="572" y="816" width="16" height="32" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="594" y="836" fill="#0f172a" font-size="10" font-weight="bold">R10 3.3k</text>
  <line x1="580" y1="848" x2="580" y2="885" stroke="#0f172a" stroke-width="1.8"/>
  <circle cx="580" cy="885" r="3.5" fill="#0f172a"/>

  <polygon points="605,788 730,788 745,800 730,812 605,812" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="670" y="804" fill="#166534" font-size="11" font-weight="bold" text-anchor="middle">ENC2_CHB_3V3</text>

  <!-- Ground Line -->
  <line x1="240" y1="821" x2="205" y2="821" stroke="#0f172a" stroke-width="2"/>
  <line x1="205" y1="821" x2="205" y2="885" stroke="#0f172a" stroke-width="2"/>
  <line x1="205" y1="885" x2="605" y2="885" stroke="#0f172a" stroke-width="2"/>
  <polygon points="605,873 730,873 745,885 730,897 605,897" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="670" y="889" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">GND</text>

  <!-- ===================================================================== -->
  <!-- 4. 1:5 GEAR DRIVE & SYMMETRICAL N52 EDDY CURRENT BRAKE (BOTTOM RIGHT) -->
  <!-- ===================================================================== -->
  <!-- GR1: Inner Rim Gear -->
  <rect x="810" y="675" width="160" height="125" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="890" y="660" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">GR1: Inner Rim</text>
  <text x="890" y="715" fill="#0f172a" font-size="11" text-anchor="middle">Pedals + Acrylic</text>
  <text x="890" y="740" fill="#334155" font-size="11" text-anchor="middle">4mm Mild Steel</text>
  <text x="890" y="765" fill="#334155" font-size="11" text-anchor="middle">Ring Gear</text>

  <line x1="970" y1="737" x2="1025" y2="737" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="997" y="725" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">1:5</text>

  <!-- GP1: Pinion Gear -->
  <rect x="1025" y="675" width="140" height="125" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="1095" y="660" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">GP1: Pinion</text>
  <text x="1095" y="715" fill="#0f172a" font-size="11" text-anchor="middle">4mm Mild Steel</text>
  <text x="1095" y="740" fill="#334155" font-size="11" text-anchor="middle">Single Shaft</text>
  <text x="1095" y="765" fill="#334155" font-size="11" text-anchor="middle">to Flywheel</text>

  <!-- Flywheel Shaft -->
  <line x1="1165" y1="737" x2="1520" y2="737" stroke="#0f172a" stroke-width="3.5"/>

  <!-- STAT1: Fixed Acrylic Stator -->
  <rect x="1200" y="655" width="70" height="165" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="1235" y="640" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">STAT1</text>
  <text x="1235" y="690" fill="#0f172a" font-size="10" text-anchor="middle">5mm Acryl</text>
  <text x="1235" y="715" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">8x N52</text>
  <text x="1235" y="775" fill="#334155" font-size="10" text-anchor="middle">30x10x5</text>
  <text x="1235" y="795" fill="#334155" font-size="10" text-anchor="middle">Alt N-S</text>

  <text x="1290" y="680" fill="#475569" font-size="10" text-anchor="middle">2mm</text>

  <!-- FLY1: Aluminum Flywheel -->
  <rect x="1310" y="635" width="85" height="205" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <text x="1352" y="620" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">FLY1: Al</text>
  <text x="1352" y="685" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">Dia 290mm</text>
  <text x="1352" y="705" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">8mm Thick</text>

  <text x="1415" y="680" fill="#475569" font-size="10" text-anchor="middle">2mm</text>

  <!-- STAT2: Movable Acrylic Stator (0-45 deg) -->
  <rect x="1435" y="655" width="75" height="165" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="1472" y="640" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">STAT2</text>
  <text x="1472" y="690" fill="#0f172a" font-size="10" text-anchor="middle">5mm Acryl</text>
  <text x="1472" y="715" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">8x N52</text>
  <text x="1472" y="775" fill="#334155" font-size="10" text-anchor="middle">0-45 deg</text>
  <text x="1472" y="795" fill="#334155" font-size="10" text-anchor="middle">via GBX2</text>
</svg>

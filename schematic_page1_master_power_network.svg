<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" font-family="Courier, 'Courier New', monospace">
  <!-- Clean White Sheet with Simple Human-Style CAD Border -->
  <rect x="0" y="0" width="1600" height="1100" fill="#ffffff"/>
  <rect x="35" y="35" width="1530" height="1030" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Simple Sheet Heading -->
  <text x="65" y="80" fill="#0f172a" font-size="18" font-weight="bold">Sheet 1: Power Supply, CC/CV Buck-LDO Regulation, Steel Chassis Earth &amp; Master ESP32-S</text>
  <line x1="65" y1="95" x2="1080" y2="95" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ===================================================================== -->
  <!-- 1. 24V 30A SMPS POWER SUPPLY & STEEL CHASSIS EARTH (TOP LEFT)         -->
  <!-- ===================================================================== -->
  <text x="80" y="155" fill="#334155" font-size="14" font-weight="bold">1. 24V 30A SMPS Power Supply &amp; Steel Chassis Earthing</text>

  <!-- J1: AC Input -->
  <rect x="80" y="195" width="115" height="150" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="137" y="185" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">J1 (AC IN)</text>
  <text x="182" y="235" fill="#0f172a" font-size="12" text-anchor="end">L</text>
  <text x="182" y="275" fill="#0f172a" font-size="12" text-anchor="end">N</text>
  <text x="182" y="315" fill="#15803d" font-size="12" font-weight="bold" text-anchor="end">PE</text>

  <line x1="195" y1="231" x2="280" y2="231" stroke="#0f172a" stroke-width="2"/>
  <line x1="195" y1="271" x2="280" y2="271" stroke="#0f172a" stroke-width="2"/>
  <line x1="195" y1="311" x2="280" y2="311" stroke="#15803d" stroke-width="2.5"/>

  <!-- Steel Chassis Earth Bond from PE/FG -->
  <circle cx="238" cy="311" r="4" fill="#15803d"/>
  <line x1="238" y1="311" x2="238" y2="395" stroke="#15803d" stroke-width="2.5"/>
  <line x1="218" y1="395" x2="258" y2="395" stroke="#15803d" stroke-width="2.5"/>
  <line x1="225" y1="403" x2="251" y2="403" stroke="#15803d" stroke-width="2.2"/>
  <line x1="232" y1="411" x2="244" y2="411" stroke="#15803d" stroke-width="2"/>
  <text x="238" y="432" fill="#166534" font-size="11" font-weight="bold" text-anchor="middle">STEEL CHASSIS EARTH STUD</text>
  <text x="238" y="447" fill="#475569" font-size="10" text-anchor="middle">(Isolated from DC STAR_GND)</text>

  <!-- PSU1: 24V 30A SMPS -->
  <rect x="280" y="180" width="250" height="185" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="405" y="168" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">PSU1: 24V 30A SMPS</text>

  <text x="295" y="235" fill="#0f172a" font-size="12">AC_L</text>
  <text x="295" y="275" fill="#0f172a" font-size="12">AC_N</text>
  <text x="295" y="315" fill="#15803d" font-size="12" font-weight="bold">FG (PE)</text>
  <text x="405" y="348" fill="#475569" font-size="10" text-anchor="middle">Set +V ADJ = 24.00V DC</text>

  <text x="515" y="240" fill="#dc2626" font-size="12" font-weight="bold" text-anchor="end">V+ (24V)</text>
  <text x="515" y="310" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="end">V- (GND)</text>

  <!-- Net Labels: +24V_BUS and GND -->
  <line x1="530" y1="236" x2="620" y2="236" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="620,223 745,223 760,236 745,249 620,249" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="685" y="240" fill="#dc2626" font-size="12" font-weight="bold" text-anchor="middle">+24V_BUS</text>

  <line x1="530" y1="306" x2="620" y2="306" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="620,293 745,293 760,306 745,319 620,319" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="685" y="310" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">GND (STAR)</text>

  <!-- ===================================================================== -->
  <!-- 2. 24V -> 5V CC/CV BUCK -> 3.3V LDO REGULATION (BOTTOM LEFT)          -->
  <!-- ===================================================================== -->
  <text x="80" y="510" fill="#334155" font-size="14" font-weight="bold">2. 24V -&gt; 5.05V CC/CV Buck &amp; 5V -&gt; 3.30V LDO Regulation</text>

  <!-- +24V_BUS Input Net Label -->
  <polygon points="80,613 190,613 205,626 190,639 80,639" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="138" y="630" fill="#dc2626" font-size="12" font-weight="bold" text-anchor="middle">+24V_BUS</text>
  <line x1="205" y1="626" x2="250" y2="626" stroke="#dc2626" stroke-width="2"/>

  <!-- U4: 24V-5V CC/CV Buck -->
  <rect x="250" y="570" width="210" height="160" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="355" y="556" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">U4: 24V-5V CC/CV BUCK</text>
  <text x="262" y="630" fill="#dc2626" font-size="11" font-weight="bold">IN+ (24V)</text>
  <text x="262" y="695" fill="#0f172a" font-size="11">IN- / OUT-</text>
  <text x="448" y="630" fill="#d97706" font-size="11" font-weight="bold" text-anchor="end">OUT+ (5V)</text>
  <text x="355" y="662" fill="#b45309" font-size="10" font-weight="bold" text-anchor="middle">Tune CV Pot = 5.05V</text>
  <text x="355" y="678" fill="#b45309" font-size="10" font-weight="bold" text-anchor="middle">Tune CC Pot = 1.90A</text>

  <line x1="295" y1="730" x2="295" y2="795" stroke="#0f172a" stroke-width="2"/>
  <circle cx="295" cy="795" r="4" fill="#0f172a"/>

  <!-- 5V Tap to +5V_BUCK Net Label -->
  <line x1="460" y1="626" x2="530" y2="626" stroke="#d97706" stroke-width="2"/>
  <circle cx="495" cy="626" r="4" fill="#d97706"/>
  <line x1="495" y1="626" x2="495" y2="515" stroke="#d97706" stroke-width="2"/>
  <line x1="495" y1="515" x2="620" y2="515" stroke="#d97706" stroke-width="2"/>
  <polygon points="620,502 745,502 760,515 745,528 620,528" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="685" y="519" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">+5V_BUCK</text>
  <text x="685" y="545" fill="#475569" font-size="10" text-anchor="middle">(To ENC1, ENC2, ACS712)</text>

  <!-- U5: 5V-3.3V LDO -->
  <rect x="530" y="570" width="195" height="160" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="627" y="556" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">U5: 5V-3.3V LDO</text>
  <text x="542" y="630" fill="#d97706" font-size="11" font-weight="bold">VIN (5V)</text>
  <text x="542" y="695" fill="#0f172a" font-size="11">GND</text>
  <text x="712" y="655" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="end">VOUT (3.3V)</text>
  <text x="627" y="715" fill="#475569" font-size="10" text-anchor="middle">Clean 3.30V to U1,U2,U3</text>

  <line x1="570" y1="730" x2="570" y2="795" stroke="#0f172a" stroke-width="2"/>
  <circle cx="570" cy="795" r="4" fill="#0f172a"/>

  <!-- +3V3_LDO Net Label -->
  <line x1="725" y1="651" x2="765" y2="651" stroke="#0284c7" stroke-width="2"/>
  <polygon points="765,638 880,638 895,651 880,664 765,664" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="825" y="655" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">+3V3_LDO</text>

  <!-- Common Ground Line -->
  <line x1="230" y1="795" x2="620" y2="795" stroke="#0f172a" stroke-width="2"/>
  <polygon points="620,782 745,782 760,795 745,808 620,808" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="685" y="799" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">GND (STAR)</text>

  <!-- ===================================================================== -->
  <!-- 3. MASTER ESP32-S NODEMCU V1.1 (U1) & ESP-NOW NETWORK (RIGHT SIDE)    -->
  <!-- ===================================================================== -->
  <text x="930" y="155" fill="#334155" font-size="14" font-weight="bold">3. Master Node U1 (ESP32-S NodeMCU V1.1)</text>

  <!-- +3V3_LDO and GND into U1 -->
  <polygon points="930,258 1045,258 1060,271 1045,284 930,284" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="990" y="275" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">+3V3_LDO</text>
  <line x1="1060" y1="271" x2="1125" y2="271" stroke="#0284c7" stroke-width="2"/>

  <polygon points="930,358 1045,358 1060,371 1045,384 930,384" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="990" y="375" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">GND (STAR)</text>
  <line x1="1060" y1="371" x2="1125" y2="371" stroke="#0f172a" stroke-width="2"/>

  <!-- U1: ESP32 Master -->
  <rect x="1125" y="200" width="320" height="230" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="1285" y="185" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">U1: ESP32-S NodeMCU V1.1</text>

  <text x="1140" y="275" fill="#0284c7" font-size="12" font-weight="bold">3V3 Pin</text>
  <text x="1140" y="375" fill="#0f172a" font-size="12" font-weight="bold">GND Pins (x2)</text>

  <text x="1430" y="260" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="end">Wi-Fi AP (192.168.4.1)</text>
  <text x="1430" y="295" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="end">ESP-NOW Ch 1 Coordinator</text>
  <text x="1430" y="330" fill="#dc2626" font-size="11" font-weight="bold" text-anchor="end">Web GUI Hard-Stop (&lt;3ms)</text>
  <text x="1430" y="365" fill="#15803d" font-size="11" font-weight="bold" text-anchor="end">Setup &amp; Calibration Trigger</text>

  <!-- Simple Wireless Link Diagram -->
  <text x="930" y="535" fill="#334155" font-size="14" font-weight="bold">4. Distributed 3-ESP32 Network Topology</text>

  <rect x="930" y="575" width="180" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="1020" y="608" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">Clinical Web GUI</text>
  <text x="1020" y="628" fill="#475569" font-size="10" text-anchor="middle">Mode / Setup / E-Stop</text>
  <text x="1020" y="646" fill="#475569" font-size="10" text-anchor="middle">(d_offset, L_leg Config)</text>

  <line x1="1110" y1="620" x2="1175" y2="620" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>

  <rect x="1175" y="575" width="150" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="1250" y="615" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">U1: ESP_MASTER</text>
  <text x="1250" y="637" fill="#0284c7" font-size="11" text-anchor="middle">(NodeMCU V1.1)</text>

  <line x1="1325" y1="595" x2="1390" y2="565" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="1325" y1="645" x2="1390" y2="675" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>

  <rect x="1390" y="525" width="145" height="70" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="1462" y="555" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">U2: ESP_TOPHUB</text>
  <text x="1462" y="577" fill="#475569" font-size="11" text-anchor="middle">(Sheet 2)</text>

  <rect x="1390" y="645" width="145" height="70" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="1462" y="675" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">U3: ESP_CYCLING</text>
  <text x="1462" y="697" fill="#475569" font-size="11" text-anchor="middle">(Sheet 3)</text>
</svg>
